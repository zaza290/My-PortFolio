<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 5 - Nested Tables</title>
    <style>
        /* Centers everything and sets default background */
        body {
            text-align: center;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding-top: 50px;
        }

        /* Styles the main title with a Serif font */
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* This creates the classic double-line border for ALL tables */
        table {
            margin: 0 auto;
            border-spacing: 2px; /* Creates the gap between the lines */
            border: 1px solid #000000; /* The outside line */
        }

        /* Adds the inside line to all table cells */
        td {
            border: 1px solid #000000;
        }

        /* Big padding for the outer table cells to create the empty space */
        .outer-td {
            padding: 40px 60px; 
            vertical-align: middle;
        }

        /* Smaller padding and a Sans-Serif font for the inner text */
        .inner-td {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            padding: 15px 25px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>ACTIVITY 5</h1>

    <table>
        <tr>
            <td class="outer-td">
                
                <table>
                    <tr>
                        <td class="inner-td">Rubber</td>
                        <td class="inner-td">baby</td>
                    </tr>
                    <tr>
                        <td class="inner-td">buggy</td>
                        <td class="inner-td">bumpers</td>
                    </tr>
                </table>

            </td>
            
            <td class="outer-td">
                
                <table>
                    <tr>
                        <td class="inner-td">She</td>
                        <td class="inner-td">sells</td>
                    </tr>
                    <tr>
                        <td class="inner-td">sea</td>
                        <td class="inner-td">shells</td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
