<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 4 - Weekly Class Schedule</title>
    <style>
        /* Sets the default font and centers the content on the page */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        /* Styling for the main headings */
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Table structural styling */
        table {
            border-collapse: collapse;
            width: 1000px; /* Makes the table wide like in the image */
            margin: 0 auto; /* Centers the table horizontally */
        }

        /* Borders and padding for all table cells */
        th, td {
            border: 1px solid #000000;
            padding: 12px;
            text-align: center;
        }

        /* Background color for the table headers */
        th {
            background-color: #add8e6; /* Light blue */
            font-weight: bold;
        }

        /* Special class for the lunch break row */
        .lunch-break {
            background-color: #ff0000; /* Bright red */
            color: #000000;
        }
    </style>
</head>
<body>

    <h1>Activity 4</h1>
    <h2>Weekly Class Schedule</h2>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>8:00 - 9:00</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>Lab</td>
            </tr>
            <tr>
                <td>9:00 - 10:00</td>
                <td>Programming</td>
                <td>Database</td>
                <td>Programming</td>
                <td>Database</td>
                <td>Lab</td>
            </tr>
            <tr>
                <td colspan="6" class="lunch-break">Lunch Break</td>
            </tr>
            <tr>
                <td>1:00 - 2:00</td>
                <td>Networking</td>
                <td>OOP</td>
                <td>Networking</td>
                <td>OOP</td>
                <td>Project</td>
            </tr>
            <tr>
                <td>2:00 - 3:00</td>
                <td>Study</td>
                <td>Study</td>
                <td>Study</td>
                <td>Study</td>
                <td>Consultation</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
